<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- AM favicon (user round 2026-10-06) — bubble letters: a fat dark
       outline stroke UNDER a flat green core stroke, both round-capped, so
       the letters read as cartoon bubbles (Bubbly-style, no gradients per
       the stack locks). Mirrors scripts/raster-icons.mjs LETTERS. -->
  <circle cx="500" cy="500" r="500" fill="#F8F9E8" />
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- dark outline pass -->
    <g stroke="#1C2225" stroke-width="172">
      <path d="M290 200 150 800" />
      <path d="M290 200 430 800" />
      <path d="M215 595 365 595" />
      <path d="M590 200 590 800" />
      <path d="M590 200 710 555 830 200" />
      <path d="M830 200 830 800" />
    </g>
    <!-- green core pass -->
    <g stroke="#5AAE5A" stroke-width="116">
      <path d="M290 200 150 800" />
      <path d="M290 200 430 800" />
      <path d="M215 595 365 595" />
      <path d="M590 200 590 800" />
      <path d="M590 200 710 555 830 200" />
      <path d="M830 200 830 800" />
    </g>
  </g>
</svg>