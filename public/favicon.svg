<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- AM favicon (user round 2026-10-06: "just write am separately") — the
       letters stand as separate glyphs, cream circle, meadow ink. Strokes are
       heavy so the mark stays legible at 16px. -->
  <circle cx="500" cy="500" r="500" fill="#F8F9E8" />
  <g
    fill="none"
    stroke="#1C2225"
    stroke-width="92"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  >
    <!-- A: apex, two feet, crossbar -->
    <path d="M290 190 150 810" />
    <path d="M290 190 430 810" />
    <path d="M205 600 375 600" />
    <!-- M: two stems and the valley -->
    <path d="M580 190 580 810" />
    <path d="M580 190 705 560 830 190" />
    <path d="M830 190 830 810" />
  </g>
</svg>